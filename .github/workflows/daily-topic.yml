name: Daily HyperShift Onboarding Topic

on:
  schedule:
    # 9:00 AM UTC, Monday-Friday
    # Adjust to your team's timezone:
    #   UTC+5:30 (IST) -> use "30 3 * * 1-5" for 9:00 AM IST
    #   UTC-5   (EST) -> use "0 14 * * 1-5" for 9:00 AM EST
    - cron: '45 5 * * 1-5'
  workflow_dispatch:
    inputs:
      topic_number:
        description: 'Override topic number (1-35). Leave empty to use counter.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  post-topic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for holidays
        id: holiday
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if jq -e ". | index(\"$TODAY\")" holidays.json > /dev/null 2>&1; then
            echo "Today ($TODAY) is a holiday. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a holiday ($TODAY). Proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read counter and pick topic
        if: steps.holiday.outputs.skip != 'true'
        id: topic
        run: |
          COUNTER_FILE=".topic-counter"
          TOPICS_FILE="daily-topics.json"
          TOTAL_TOPICS=$(jq length "$TOPICS_FILE")

          # Use manual override if provided
          if [ -n "${{ github.event.inputs.topic_number }}" ]; then
            CURRENT=$(( ${{ github.event.inputs.topic_number }} - 1 ))
          else
            CURRENT=$(cat "$COUNTER_FILE" 2>/dev/null || echo "0")
          fi

          # Stop after all topics are done
          if [ "$CURRENT" -ge "$TOTAL_TOPICS" ]; then
            echo "All $TOTAL_TOPICS topics have been posted. Workflow complete."
            echo "done=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract topic
          TOPIC=$(jq -r ".[$CURRENT]" "$TOPICS_FILE")
          DAY=$(echo "$TOPIC" | jq -r '.day')
          TITLE=$(echo "$TOPIC" | jq -r '.title')
          ABOUT=$(echo "$TOPIC" | jq -r '.about')
          WHY=$(echo "$TOPIC" | jq -r '.why_it_matters')
          SECTION=$(echo "$TOPIC" | jq -r '.guide_section')
          EXPLORE=$(echo "$TOPIC" | jq -r '.explore_hint')
          ANCHOR=$(echo "$TOPIC" | jq -r '.guide_anchor')

          # Build key_points as bullet list
          KEY_POINTS=""
          while IFS= read -r point; do
            KEY_POINTS="${KEY_POINTS}• ${point}\n"
          done < <(echo "$TOPIC" | jq -r '.key_points[]')

          # Build code_paths as plain text list
          CODE_PATHS=""
          while IFS= read -r path; do
            CODE_PATHS="${CODE_PATHS}• \`${path}\`\n"
          done < <(echo "$TOPIC" | jq -r '.code_paths[]')

          # Export for next step
          {
            echo "done=false"
            echo "day=$DAY"
            echo "total=$TOTAL_TOPICS"
            echo "next_counter=$((CURRENT + 1))"
          } >> "$GITHUB_OUTPUT"

          # Write multi-line values to files to preserve formatting
          echo "$TITLE" > /tmp/title.txt
          echo "$ABOUT" > /tmp/about.txt
          echo -e "$KEY_POINTS" > /tmp/key_points.txt
          echo "$WHY" > /tmp/why.txt
          echo "$SECTION" > /tmp/section.txt
          echo "$EXPLORE" > /tmp/explore.txt
          echo -e "$CODE_PATHS" > /tmp/code_paths.txt
          echo "$ANCHOR" > /tmp/anchor.txt

      - name: Post to Slack
        if: steps.holiday.outputs.skip != 'true' && steps.topic.outputs.done != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          DAY="${{ steps.topic.outputs.day }}"
          TOTAL="${{ steps.topic.outputs.total }}"
          TITLE=$(cat /tmp/title.txt)
          ABOUT=$(cat /tmp/about.txt)
          KEY_POINTS=$(cat /tmp/key_points.txt)
          WHY=$(cat /tmp/why.txt)
          SECTION=$(cat /tmp/section.txt)
          EXPLORE=$(cat /tmp/explore.txt)
          CODE_PATHS=$(cat /tmp/code_paths.txt)
          ANCHOR=$(cat /tmp/anchor.txt)

          # Escape special characters for JSON
          escape_json() {
            local s="$1"
            s="${s//\\/\\\\}"
            s="${s//\"/\\\"}"
            s="${s//$'\n'/\\n}"
            s="${s//$'\t'/\\t}"
            echo "$s"
          }

          TITLE_ESC=$(escape_json "$TITLE")
          ABOUT_ESC=$(escape_json "$ABOUT")
          KEY_POINTS_ESC=$(escape_json "$KEY_POINTS")
          WHY_ESC=$(escape_json "$WHY")
          SECTION_ESC=$(escape_json "$SECTION")
          EXPLORE_ESC=$(escape_json "$EXPLORE")
          CODE_PATHS_ESC=$(escape_json "$CODE_PATHS")

          # Build Slack message payload
          cat > /tmp/slack-payload.json <<SLACKEOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": ":books: HyperShift Onboarding — Day ${DAY}/${TOTAL}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*${TITLE_ESC}*"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "${ABOUT_ESC}"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":pushpin: *Key Points:*\n${KEY_POINTS_ESC}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":dart: *Why It Matters:*\n${WHY_ESC}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":file_folder: *Code Paths:*\n${CODE_PATHS_ESC}"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":bulb: *Try this:* ${EXPLORE_ESC}"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": ":open_book: <https://github.com/vsolanki12/hypershift-explorers-onboarding/blob/main/onboarding-guide.md#${ANCHOR}|${SECTION_ESC}> — click to read this section"
                  }
                ]
              },
              {
                "type": "divider"
              }
            ]
          }
          SLACKEOF

          # Post to Slack
          HTTP_CODE=$(curl -s -o /tmp/slack-response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d @/tmp/slack-payload.json \
            "$SLACK_WEBHOOK_URL")

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Slack post failed with HTTP $HTTP_CODE"
            cat /tmp/slack-response.txt
            exit 1
          fi

          echo "Posted Day ${DAY}/${TOTAL}: ${TITLE}"

      - name: Bump counter
        if: steps.holiday.outputs.skip != 'true' && steps.topic.outputs.done != 'true'
        run: |
          echo "${{ steps.topic.outputs.next_counter }}" > .topic-counter
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .topic-counter
          git commit -m "chore: bump topic counter to day ${{ steps.topic.outputs.next_counter }}"
          git push

      - name: Disable workflow after completion
        if: steps.holiday.outputs.skip != 'true' && steps.topic.outputs.done == 'true'
        run: |
          echo "All topics posted. To restart, reset .topic-counter to 0."
