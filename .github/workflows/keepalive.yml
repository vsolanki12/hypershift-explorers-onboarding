name: Keep Scheduler Alive

on:
  schedule:
    # Run at 6:00 AM UTC (11:30 AM IST) every day — 15 min after the main workflow
    # If the main cron didn't fire, this triggers it via workflow_dispatch
    - cron: '0 6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check if main workflow ran today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAY_OF_WEEK=$(date -u +%u)

          # Skip weekends (6=Sat, 7=Sun)
          if [ "$DAY_OF_WEEK" -ge 6 ]; then
            echo "Weekend. Skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if the main workflow ran today
          RUNS=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq "[.workflow_runs[] | select(.name == \"Daily HyperShift Onboarding Topic\" and (.created_at | startswith(\"$TODAY\")))] | length")

          if [ "$RUNS" -gt 0 ]; then
            echo "Main workflow already ran today ($RUNS runs). No action needed."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Main workflow did NOT run today. Triggering it now."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger main workflow
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Daily HyperShift Onboarding Topic" --repo ${{ github.repository }}
          echo "Triggered main workflow."

      - name: Keep repo active
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit keepalive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive ping [skip ci]"
          git push
